services:
  nginx:
    image: nginx:1.30.4
    container_name: personal-blog-nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - personal-blog-network
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: personal-blog-php
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-personal-blog.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - personal-blog-network
    restart: unless-stopped

  mysql:
    image: mysql:8.4.11
    container_name: personal-blog-mysql
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      TZ: "${TZ}"
    volumes:
      - personal-blog-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - personal-blog-network
    restart: unless-stopped

networks:
  personal-blog-network:
    name: personal-blog-network
    driver: bridge

volumes:
  personal-blog-mysql-data:
    name: personal-blog-mysql-data
